<!DOCTYPE html>
<html dir="rtl" lang="ar" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitch Deck - Seen Automation</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <style>
        body { overflow-x: hidden; }
        .pitch-hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .slide-full { min-height: 80vh; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px 20px; animation: fadeIn 0.5s; }
        .slide-full.active { display: flex; }
        .slide-number { position: absolute; top: 80px; left: 20px; font-size: 0.9rem; color: var(--gold); }
        .fs-btn { position: fixed; bottom: 20px; left: 20px; background: var(--emerald); color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; z-index: 1000; }
    </style>
</head>
<body>
    <div id="progress-bar"></div>
    <div class="watermark" id="watermark"></div>
    <button class="fs-btn" onclick="toggleFS()">⛶ ملء الشاشة</button>
    
    <nav>
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <svg width="30" height="30" viewBox="0 0 100 100"><path d="M50 10 L90 30 L90 70 L50 90 L10 70 L10 30 Z" fill="#0F5132"/><path d="M50 25 L75 37.5 L75 62.5 L50 75 L25 62.5 L25 37.5 Z" fill="#D4AF37"/></svg>
                Seen Automation
            </a>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 / ☀️</button>
            <div class="nav-links">
                <a href="index.html">الرئيسية</a>
                <a href="overview.html">من نحن</a>
                <a href="opportunity.html">الفرصة</a>
                <a href="solution.html">الحل</a>
                <a href="readiness.html">الجاهزية</a>
                <a href="financials.html">المالية</a>
                <a href="business-plan.html">خطة العمل</a>
                <a href="pitch.html" class="active">Pitch Deck</a>
                <a href="team.html">الفريق</a>
                <a href="roadmap.html">خريطة الطريق</a>
                <a href="contact.html">التواصل</a>
                <a href="dataroom/index.html">غرفة البيانات</a>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 900px; margin-top: 40px;">
        <div class="deck-container" id="pitch-deck" style="min-height: 400px;">
            <div id="slides"></div>
            <div class="deck-controls">
                <button class="deck-btn" onclick="prevSlide()">السابق</button>
                <button class="deck-btn" onclick="nextSlide()">التالي</button>
            </div>
            <div class="dots" id="deck-dots"></div>
        </div>
    </div>

    <script src="assets/app.js"></script>
    <script>
        function toggleFS() {
            const el = document.getElementById('pitch-deck');
            if (!document.fullscreenElement) el.requestFullscreen().catch(err => console.log(err));
            else document.exitFullscreen();
        }
    </script>
</body>
</html>
